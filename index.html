<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecteur QR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: une seule colonne, vidéo en haut, dernier résultat puis historique */
:root {
  --bg: #f3f5f4; --surface: #ffffff; --fg: #17201d; --muted: #5d6b66;
  --line: #d6ddda; --accent: #0f7a5c; --accent-fg: #ffffff; --warn: #a4471b;
  --display: "Sora", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #111715; --surface: #1a2320; --fg: #e6ece9; --muted: #95a39e;
  --line: #2c3834; --accent: #3fc79c; --accent-fg: #06130f; --warn: #f08a5d; color-scheme: dark } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
.wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; display: grid; gap: 18px; }
h1 { font-family: var(--display); font-size: 1.6rem; margin: 0; }
.sub { color: var(--muted); margin: 4px 0 0; }
.stage { position: relative; background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; }
video { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame { position: absolute; inset: 18%; border: 3px solid rgba(255,255,255,.85); border-radius: 16px; pointer-events: none; transition: border-color .15s; }
.frame.hit { border-color: var(--accent); }
.idle { position: absolute; inset: 0; display: grid; place-items: center; color: #cfd8d4; text-align: center; padding: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { font: 600 1rem var(--display); background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
select { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); max-width: 100%; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 8px; min-width: 0; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.value { font-family: var(--mono); word-break: break-all; white-space: pre-wrap; margin: 0; }
.err { color: var(--warn); }
ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
ol li { font-family: var(--mono); font-size: .9rem; word-break: break-all; }
ol time { color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lecteur QR</h1>
    <p class="sub">Active la caméra et place le QR code dans le cadre : il est lu automatiquement.</p>
  </header>

  <div class="stage">
    <video id="video" playsinline muted></video>
    <div class="frame" id="frame"></div>
    <div class="idle" id="idle">Caméra éteinte</div>
  </div>

  <div class="row">
    <button class="btn" id="toggle" type="button">Activer la caméra</button>
    <select id="cams" hidden aria-label="Choisir la caméra"></select>
  </div>

  <section class="card">
    <span class="label" id="kind">Dernier scan</span>
    <pre class="value" id="value">Aucun QR lu pour l'instant.</pre>
    <div class="row"><button class="btn ghost" id="copy" type="button" hidden>Copier</button></div>
  </section>

  <section class="card">
    <span class="label">Historique</span>
    <ol id="history"></ol>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $("video"), canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
let stream = null, last = "", lastAt = 0;

function show(kind, text, isErr) {
  $("kind").textContent = kind;
  $("value").textContent = text;
  $("value").classList.toggle("err", !!isErr);
  $("copy").hidden = !!isErr;
}

async function listCams() {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  const sel = $("cams"), current = stream?.getVideoTracks()[0]?.getSettings().deviceId;
  sel.innerHTML = "";
  devices.forEach((d, i) => sel.add(new Option(d.label || "Caméra " + (i + 1), d.deviceId, false, d.deviceId === current)));
  sel.hidden = devices.length < 2;
}

async function start(deviceId) {
  stop();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: "environment" }
    });
  } catch (e) {
    return show("Caméra indisponible", e.name === "NotAllowedError"
      ? "Accès refusé. Autorise la caméra dans le navigateur puis réessaie."
      : "Impossible d'ouvrir la caméra (" + e.name + ").", true);
  }
  video.srcObject = stream;
  await video.play();
  $("idle").hidden = true;
  $("toggle").textContent = "Couper la caméra";
  listCams();
  requestAnimationFrame(tick);
}

function stop() {
  stream?.getTracks().forEach(t => t.stop());
  stream = null;
  video.srcObject = null;
  $("idle").hidden = false;
  $("toggle").textContent = "Activer la caméra";
}

function tick() {
  if (!stream) return;
  if (video.readyState >= 2) {
    const w = 640, h = Math.round(video.videoHeight * w / video.videoWidth) || 480;
    canvas.width = w; canvas.height = h;
    ctx.drawImage(video, 0, 0, w, h);
    const img = ctx.getImageData(0, 0, w, h);
    const code = jsQR(img.data, w, h, { inversionAttempts: "dontInvert" });
    if (code && code.data) found(code.data);
  }
  setTimeout(() => requestAnimationFrame(tick), 120);
}

function found(text) {
  const now = Date.now();
  $("frame").classList.add("hit");
  setTimeout(() => $("frame").classList.remove("hit"), 400);
  if (text === last && now - lastAt < 3000) return;  // évite les doublons du même QR
  last = text; lastAt = now;
  show(/^https?:\/\//i.test(text) ? "Lien" : "Texte", text);
  navigator.vibrate?.(60);
  const li = document.createElement("li");
  const t = document.createElement("time");
  t.textContent = new Date().toLocaleTimeString("fr-FR");
  li.append(t, text);
  $("history").prepend(li);
}

$("toggle").addEventListener("click", () => stream ? stop() : start());
$("cams").addEventListener("change", e => start(e.target.value));
$("copy").addEventListener("click", () => {
  navigator.clipboard.writeText($("value").textContent).then(() => {
    $("copy").textContent = "Copié";
    setTimeout(() => $("copy").textContent = "Copier", 1500);
  }, () => {});
});
if (!navigator.mediaDevices?.getUserMedia) show("Caméra indisponible", "Ce navigateur ne permet pas l'accès à la caméra ici. Ouvre la page via http://localhost.", true);
</script>
</body>
</html>
